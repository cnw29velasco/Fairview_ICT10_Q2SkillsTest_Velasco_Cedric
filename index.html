<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script><title>Fairview_ICT10_Q2SkillsTest_Velasco_Cedric</title>

    <style>
body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#667eea,#7b6aaa);
    font-family:'Segoe UI',sans-serif;
}

.container{
    max-width:700px;
}

.lookup{
    margin-top:20px;
}

.card-box{
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(15px);
    border-radius:20px;
    padding:40px;
    box-shadow:0 8px 32px rgba(0,0,0,0.2);
    color:white;
}

h1{
    font-weight:700;
    margin-bottom:15px;
}

p{
    font-size:1rem;
}

input{
    width:100%;
    padding:12px;
    border:none;
    outline:none;
    border-radius:12px;
    margin-bottom:15px;
}

button{
    background:#5255d8;
    color:white;
    border:none;
    padding:12px 25px;
    border-radius:12px;
    font-weight:bold;
    transition:0.3s;
}

button:hover{
    background:#361282;
    transform:translateY(-3px);
}

.lookup p{
    background:rgba(255,255,255,0.15);
    padding:10px;
    border-radius:10px;
    margin-bottom:10px;
}

span{
    color:#ffeb3b;
    font-weight:bold;
}
</style>

</head>
<body>

    <center>
    <div class="container">
    <h1>Find any non-metal here!</h1>
    <p>Enter a nonmetal to search</p>

    <input type="text" id="nonmetal" placeholder="Example: H">

    <br>
    <br>


    <button py-click="find_nonmetal">Find nonmetal</button>
    <div class="lookup">

    <br>
        <h1>Non-metal Properties</h1>
    <br>

    
    <p><b>Non-metal Code:</b><span id="nonmetalcode"></span></p>
    <p><b>Non-metal Symbol:</b><span id="symbol"></span></p>
    <p><b>Non-metal Element:</b><span id="element"></span></p>
    <p><b>Atomic Number:</b><span id="atomic number"></span></p>
    <p><b>Atmoic Mass:</b><span id="atomic mass"></span></p>

    <div class="lookup"></div>
    </div>
    <script type="py" src="main.py"></script>
    </center>
</body>
</html>
